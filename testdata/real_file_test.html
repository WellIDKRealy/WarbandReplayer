<!DOCTYPE html>
<html><body><pre id="out">running...</pre>
<script>
let log = "";
function line(s) { log += s + "\n"; document.getElementById('out').textContent = log; console.log(s); }

function makeWorker() { return new Worker('../replay-worker.js?v=' + Date.now()); }
function waitFor(worker, predicate) {
  return new Promise((resolve, reject) => {
    const handler = (e) => {
      if (e.data.type === 'error') { worker.removeEventListener('message', handler); reject(new Error(JSON.stringify(e.data))); return; }
      if (predicate(e.data)) { worker.removeEventListener('message', handler); resolve(e.data); }
    };
    worker.addEventListener('message', handler);
  });
}

(async () => {
  try {
    line("crossOriginIsolated=" + crossOriginIsolated);
    const memory = new WebAssembly.Memory({ initial: 16384, maximum: 16384, shared: true }); // 1GB
    const module = await WebAssembly.compile(await (await fetch('../replay_worker.wasm', { cache: 'no-store' })).arrayBuffer());

    line("fetching real replay file...");
    const fetchT0 = performance.now();
    const fileResp = await fetch('replayLog_real_15battles.sqlite');
    const fileBlob = await fileResp.blob();
    const file = new File([fileBlob], 'replayLog_real_15battles.sqlite');
    line(`fetched ${(file.size/1024/1024).toFixed(1)}MB in ${(performance.now()-fetchT0).toFixed(0)}ms`);

    const loader = makeWorker();
    send: {
      loader.postMessage({ type: 'init', role: 'loader', memory, module, threadId: 0 });
    }
    await waitFor(loader, d => d.type === 'ready');
    line("loader ready");

    let lastPct = -1;
    loader.addEventListener('message', (e) => {
      if (e.data.type === 'progress') {
        const pct = Math.round((e.data.loaded / e.data.total) * 100);
        if (pct !== lastPct && pct % 10 === 0) { line(`  load progress: ${pct}% (${(e.data.loaded/1024/1024).toFixed(0)}MB)`); lastPct = pct; }
      }
    });

    const t0 = performance.now();
    const loadResultPromise = waitFor(loader, d => d.type === 'loaded');
    loader.postMessage({ type: 'load', file });
    const loadResult = await loadResultPromise;
    const loadMs = performance.now() - t0;

    line(`\n=== LOAD COMPLETE in ${(loadMs/1000).toFixed(2)}s ===`);
    line("matchCount: " + loadResult.matchCount);
    line("matches: " + JSON.stringify(loadResult.matches, null, 1));
    line("total time span: " + (loadResult.totalEnd - loadResult.totalStart).toFixed(0) + "s");

    // --- parallel bounds: 1 vs N readers, on the REAL data ---
    async function timeBounds(readerCount, mem) {
      const readers = [];
      let remaining = readerCount;
      const t0 = performance.now();
      await new Promise((resolve, reject) => {
        for (let i = 0; i < readerCount; i++) {
          const w = makeWorker();
          w.onmessage = (e) => {
            if (e.data.type === 'ready') w.postMessage({ type: 'computeBounds', readerIdx: i, readerCount });
            else if (e.data.type === 'boundsReady') { w.terminate(); remaining--; if (remaining === 0) resolve(); }
            else if (e.data.type === 'error') reject(new Error(e.data.message));
          };
          w.postMessage({ type: 'init', role: 'reader', memory: mem, module, threadId: i + 1 });
          readers.push(w);
        }
      });
      return performance.now() - t0;
    }

    // lock-counter/VFS-trace introspection (see wasm_vfs_debug_shared_count,
    // wasm_vfs_get_lock_trace) - kept as a permanent, cheap regression guard:
    // this is exactly the instrumentation that caught the single-writer
    // lock-leak bug during development (see the PREFETCH-AHEAD-OF-CURSOR
    // section below), not just one-off debugging.
    async function checkLockCounters(label) {
        const p = waitFor(loader, d => d.type === 'lockCounters');
        loader.postMessage({ type: 'getLockCounters' });
        const c = await p;
        line(`  [lock counters @ ${label}] shared_count=${c.sharedCount} exclusive_kind=${c.exclusiveKind}`);
    }

    line("\n=== PARALLEL BOUNDS COMPUTATION (real 2.3M-row agent_states) ===");
    const oneReaderMs = await timeBounds(1, memory);
    line("1 reader:  " + oneReaderMs.toFixed(1) + "ms");
    const hw = Math.min(navigator.hardwareConcurrency || 4, 8);
    const nReaderMs = await timeBounds(hw, memory);
    line(hw + " readers: " + nReaderMs.toFixed(1) + "ms");
    line("speedup: " + (oneReaderMs / nReaderMs).toFixed(2) + "x");

    const combinedPromise = waitFor(loader, d => d.type === 'boundsCombined');
    loader.postMessage({ type: 'combineBounds', readerCount: hw });
    const combined = await combinedPromise;
    line("combined bounds: " + JSON.stringify(combined));

    // --- lazy per-battle loading: jump straight to the LAST battle (never
    // touched anything before it), confirm it works and is fast, proving no
    // dependency on/scan of earlier battles' data. Then jump to the FIRST
    // battle to confirm isolation goes both ways. ---
    line("\n=== LAZY PER-BATTLE LOADING ===");
    async function timedFrame(t) {
        const t0 = performance.now();
        const fp = waitFor(loader, d => d.type === 'frame');
        loader.postMessage({ type: 'frame', time: t, seek: true });
        const f = await fp;
        return { ms: performance.now() - t0, count: f.count, activeMatchIndex: f.activeMatchIndex };
    }
    const lastMatch = loadResult.matches[loadResult.matches.length - 1];
    const rLast1 = await timedFrame(lastMatch.startTime + 5);
    line(`jump straight to LAST battle (#${loadResult.matches.length-1}), 1st access: ${rLast1.ms.toFixed(1)}ms count=${rLast1.count} match=${rLast1.activeMatchIndex}`);
    const rLast2 = await timedFrame(lastMatch.startTime + 10);
    line(`same battle, 2nd access (index already built):        ${rLast2.ms.toFixed(1)}ms count=${rLast2.count}`);
    const rFirst = await timedFrame(loadResult.matches[0].startTime + 5);
    line(`jump to FIRST battle (never touched until now):        ${rFirst.ms.toFixed(1)}ms count=${rFirst.count} match=${rFirst.activeMatchIndex}`);
    await checkLockCounters('after g_db\'s OWN CREATE INDEX calls, before prefetch worker even exists');

    // --- prefetch-ahead-of-cursor: a dedicated 'prefetch' worker (its own
    // READWRITE connection + heap slab, thread id 9) builds a battle's index
    // in the background; confirm that once it finishes, the playback
    // worker's own access to that battle is fast (no live cold-open cost),
    // while an equally-untouched battle that was NOT prefetched is still
    // slow - proving the speedup actually comes from the prefetch, not from
    // something else (e.g. general warm-up). ---
    line("\n=== PREFETCH-AHEAD-OF-CURSOR ===");
    const prefetchWorker = makeWorker();
    await new Promise((resolve, reject) => {
        prefetchWorker.onmessage = (e) => {
            if (e.data.type === 'ready') resolve();
            else if (e.data.type === 'error') reject(new Error(JSON.stringify(e.data)));
        };
        prefetchWorker.postMessage({ type: 'init', role: 'prefetch', memory, module, threadId: 9 });
    });
    line("prefetch worker ready (thread id 9, own connection + heap slab)");

    const prefetchIdx = 6, coldIdx = 9; // both untouched so far by loader/playback (only #0 and #12 have been visited)
    const prefetchTarget = loadResult.matches[prefetchIdx];
    // reset the shared VFS lock/IO trace right before the interesting part
    // (it's a small fixed buffer, shared across every connection/thread -
    // see wasm_vfs_reset_traces) so it captures exactly the prefetch +
    // visibility-check sequence, not the noise from loading/earlier queries.
    loader.postMessage({ type: 'resetVfsTraces' });
    await waitFor(loader, d => d.type === 'vfsTracesReset');
    const prefetchT0 = performance.now();
    await new Promise((resolve, reject) => {
        prefetchWorker.onmessage = (e) => {
            if (e.data.type === 'prefetched') resolve();
            else if (e.data.type === 'error') reject(new Error(JSON.stringify(e.data)));
        };
        prefetchWorker.postMessage({ type: 'prefetchBattle', matchIdx: prefetchIdx, startTickId: prefetchTarget.startTickId, endTickId: prefetchTarget.endTickId });
    });
    line(`prefetch (bounds only, read-only connection) battle #${prefetchIdx} completed in ${(performance.now() - prefetchT0).toFixed(1)}ms - off the playback worker entirely`);
    prefetchWorker.terminate();

    const tracePromise = waitFor(loader, d => d.type === 'vfsTraces');
    loader.postMessage({ type: 'getVfsTraces' });
    const traces = await tracePromise;
    line("--- VFS lock trace (prefetch bisection only - confirms no write/BUSY attempted) ---");
    line(traces.lockTrace);

    // second half: priming actually builds the index - the one write every
    // battle still needs (single-writer model, see replay_prefetch_battle's
    // comment) - but now on playbackWorker's own connection, using the
    // bounds prefetch already computed, and happening NOW (ahead of the
    // cursor) rather than live when the user's frame request arrives.
    const primeT0 = performance.now();
    const primePromise = waitFor(loader, d => d.type === 'battlePrimed');
    loader.postMessage({ type: 'primeBattle', matchIdx: prefetchIdx });
    await primePromise;
    line(`prime (actual index build, on playback worker) battle #${prefetchIdx} completed in ${(performance.now() - primeT0).toFixed(1)}ms`);

    const rPrefetched = await timedFrame(prefetchTarget.startTime + 5);
    line(`jump to PREFETCHED+PRIMED battle #${prefetchIdx}:               ${rPrefetched.ms.toFixed(1)}ms count=${rPrefetched.count} match=${rPrefetched.activeMatchIndex}`);
    const coldTarget = loadResult.matches[coldIdx];
    const rCold = await timedFrame(coldTarget.startTime + 5);
    line(`jump to NOT-prefetched battle #${coldIdx} (control):            ${rCold.ms.toFixed(1)}ms count=${rCold.count} match=${rCold.activeMatchIndex}`);

    // --- corpses (accumulate for the whole battle, never shrink except on a
    // new battle/backward seek, and are drawn before living units so they
    // render underneath) + chat (delivered progressively as tick_id is
    // crossed, not dumped all at once) - both against a real long battle. ---
    line("\n=== CORPSES + CHAT PACING (battle #1, a long one) ===");
    const longBattle = loadResult.matches[1];
    const steps = 8;
    let cumulativeChats = 0;
    const chatArrivals = [];
    const corpseTrend = [];
    let orderViolation = false;
    for (let i = 0; i <= steps; i++) {
        // stay 5s clear of both edges - exact start/end boundary ticks can
        // be sparse/empty transition frames (seen earlier in this file's
        // testing), which isn't what this is trying to measure.
        const lo = longBattle.startTime + 5, hi = longBattle.endTime - 5;
        const t = lo + (hi - lo) * (i / steps);
        const fp = waitFor(loader, d => d.type === 'frame');
        loader.postMessage({ type: 'frame', time: t, seek: i === 0 });
        const f = await fp;
        const newChats = (f.chatMessages || []).length;
        cumulativeChats += newChats;
        chatArrivals.push(newChats);

        let corpseCount = 0, seenLiving = false;
        for (let k = 0; k < f.count; k++) {
            const team = f.buffer[k * 3 + 2];
            const isCorpse = team === 2 || team === 3 || team === 4;
            if (isCorpse) { corpseCount++; if (seenLiving) orderViolation = true; }
            else seenLiving = true;
        }
        corpseTrend.push(corpseCount);
        line(`  step ${i}: t=+${(t - longBattle.startTime).toFixed(0)}s newChats=${newChats} corpses=${corpseCount} living=${f.count - corpseCount} match=${f.activeMatchIndex}`);
    }
    line(`chat arrival distribution across ${steps + 1} steps: [${chatArrivals.join(',')}] (total ${cumulativeChats})`);
    line(`corpse count by step: [${corpseTrend.join(',')}]`);
    const corpsesNonDecreasing = corpseTrend.every((v, i) => i === 0 || v >= corpseTrend[i - 1]);
    const chatNotAllAtOnce = cumulativeChats === 0 || chatArrivals[0] < cumulativeChats;

    // --- playback smoothness: request 100 sequential frames across the whole timeline, time each ---
    line("\n=== PLAYBACK: 100 sequential frame requests across full timeline ===");
    const frameTimes = [];
    const span = loadResult.totalEnd - loadResult.totalStart;
    for (let i = 0; i < 100; i++) {
      const t = loadResult.totalStart + (span * i) / 100;
      const ft0 = performance.now();
      const fp = waitFor(loader, d => d.type === 'frame');
      loader.postMessage({ type: 'frame', time: t, seek: false });
      const f = await fp;
      frameTimes.push(performance.now() - ft0);
      if (i === 0) line("first frame: count=" + f.count + " activeMatch=" + f.activeMatchIndex);
    }
    const sorted = [...frameTimes].sort((a, b) => a - b);
    const avg = sorted.reduce((a, b) => a + b, 0) / sorted.length;
    const p50 = sorted[Math.floor(sorted.length * 0.5)];
    const p95 = sorted[Math.floor(sorted.length * 0.95)];
    const max = sorted[sorted.length - 1];
    // this sweep steps ~72s at a time across the whole 7206s timeline with
    // lazy per-battle loading, so it deliberately crosses into a
    // never-before-seen battle repeatedly - each of those pays a one-time
    // index-build cost (self-healing, see replay_ensure_battle_ready), same
    // idea as a video player buffering a freshly-scrubbed-to segment. avg/p95
    // are dominated by those one-time costs, not steady-state playback -
    // what matters for "is playback smooth" is p50 (frames within an
    // already-resolved battle) and that the slow-frame count doesn't exceed
    // the number of battles (i.e. nothing is being redundantly rebuilt).
    const coldFrames = frameTimes.filter(t => t > 16.6).length;
    line(`frame request latency: avg=${avg.toFixed(2)}ms p50=${p50.toFixed(2)}ms p95=${p95.toFixed(2)}ms max=${max.toFixed(2)}ms coldFrames=${coldFrames}`);

    loader.terminate();

    const checks = [
      ["match count near 15 (Discord claim)", loadResult.matchCount >= 10 && loadResult.matchCount <= 20],
      ["load completed without error", true],
      ["bounds are sane", combined.maxX - combined.minX < 5000 && combined.maxY - combined.minY < 5000],
      ["steady-state (already-loaded battle) frame latency well under 16.6ms (60fps budget)", p50 < 16.6],
      ["slow frames bounded by battle count (no redundant rebuild)", coldFrames <= loadResult.matchCount],
      ["prefetched battle is fast on first live access", rPrefetched.ms < 16.6],
      ["prefetch is the reason: un-prefetched control battle is still slow", rCold.ms > 16.6],
      ["corpses drawn before living units in the frame buffer (renders underneath)", !orderViolation],
      ["corpse count never decreases across forward playback within a battle", corpsesNonDecreasing],
      ["chat delivered progressively, not dumped all at once on battle entry", chatNotAllAtOnce],
    ];
    let allPass = true;
    for (const [name, ok] of checks) { line((ok?"PASS":"FAIL") + ": " + name); if (!ok) allPass = false; }
    line(allPass ? "\nRESULT: PASS" : "\nRESULT: FAIL");
  } catch (e) {
    line("EXCEPTION: " + e.message + "\n" + (e.stack || ""));
  }
})();
</script>
</body></html>
