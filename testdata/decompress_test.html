<!DOCTYPE html>
<html><body><pre id="out">running...</pre>
<script>
let log = "";
function line(s) { log += s + "\n"; document.getElementById('out').textContent = log; console.log(s); }

(async () => {
  try {
    // deterministic, mixed-compressibility input (same generator as compress_test.html)
    const text = "The quick brown fox jumps over the lazy dog. ".repeat(80000);
    let rnd = 12345;
    function nextRnd() { rnd = (rnd * 1103515245 + 12345) & 0x7fffffff; return rnd; }
    const randomTail = new Uint8Array(200000);
    for (let i = 0; i < randomTail.length; i++) randomTail[i] = nextRnd() & 0xff;
    const textBytes = new TextEncoder().encode(text);
    const input = new Uint8Array(textBytes.length + randomTail.length);
    input.set(textBytes, 0);
    input.set(randomTail, textBytes.length);
    line(`input: ${input.length} bytes`);

    const worker = new Worker('../compress-worker.js?v=' + Date.now());
    function send(type, data, extra) {
      return new Promise((resolve, reject) => {
        const handler = (e) => {
          if (e.data.type === 'compressed' || e.data.type === 'decompressed') { worker.removeEventListener('message', handler); resolve(e.data.out); }
          else if (e.data.type === 'error') { worker.removeEventListener('message', handler); reject(new Error(e.data.message)); }
        };
        worker.addEventListener('message', handler);
        worker.postMessage(Object.assign({ type, data }, extra), [data.buffer]);
      });
    }

    const t0 = performance.now();
    const compressed = await send('compress', input.slice(), { dictSizeMiB: 24 });
    line(`compressed: ${compressed.length} bytes in ${(performance.now() - t0).toFixed(1)}ms`);

    const t1 = performance.now();
    const decompressed = await send('decompress', compressed.slice());
    line(`decompressed: ${decompressed.length} bytes in ${(performance.now() - t1).toFixed(1)}ms`);

    let identical = decompressed.length === input.length;
    if (identical) {
      for (let i = 0; i < input.length; i++) {
        if (decompressed[i] !== input[i]) { identical = false; line(`first mismatch at byte ${i}: got ${decompressed[i]}, want ${input[i]}`); break; }
      }
    }

    const checks = [
      ["decompressed length matches original input length", decompressed.length === input.length],
      ["decompressed bytes are bit-for-bit identical to the original input", identical],
    ];
    let allPass = true;
    line("");
    for (const [name, ok] of checks) { line((ok ? "PASS" : "FAIL") + ": " + name); if (!ok) allPass = false; }
    line(allPass ? "\nRESULT: PASS" : "\nRESULT: FAIL");

    worker.terminate();
  } catch (e) {
    line("EXCEPTION: " + e.message + "\n" + (e.stack || ""));
  }
})();
</script>
</body></html>
