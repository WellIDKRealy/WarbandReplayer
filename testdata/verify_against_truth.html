<!DOCTYPE html>
<html><body><pre id="out">running...</pre>
<script>
// Ground-truth verification harness: drives the REAL replay_worker.wasm
// exactly as main.js would (same seek/frame/chat message protocol), but
// instead of rendering anything, dumps the actual output and diffs it
// against ground_truth.json (generated by ground_truth.py directly from
// SQL - the authoritative source, never touching the wasm engine at all).
//
// Usage: verify_against_truth.html?file=<sqlite file served under testdata/>&gt=<ground truth json>
//
// Exposes window.__testResult = {..., done:true} for automated runners
// (see run_test_suite.py) in addition to the human-readable on-page log.
let log = "";
function line(s) { log += s + "\n"; document.getElementById('out').textContent = log; console.log(s); }
function waitFor(worker, predicate) {
  return new Promise((resolve, reject) => {
    const handler = (e) => {
      if (e.data.type === 'error') { worker.removeEventListener('message', handler); reject(new Error(JSON.stringify(e.data))); return; }
      if (predicate(e.data)) { worker.removeEventListener('message', handler); resolve(e.data); }
    };
    worker.addEventListener('message', handler);
  });
}

window.__testResult = { done: false };

(async () => {
  const result = { file: null, groundTruthFile: null, done: false, allPass: false };
  window.__testResult = result;
  try {
    const params = new URLSearchParams(location.search);
    const sqliteFile = params.get('file');
    const gtFile = params.get('gt') || 'ground_truth.json';
    result.file = sqliteFile;
    result.groundTruthFile = gtFile;
    if (!sqliteFile) { throw new Error('pass ?file=<name>.sqlite (served from testdata/)'); }

    line(`file=${sqliteFile} groundTruth=${gtFile}`);
    const gt = await (await fetch(gtFile, { cache: 'no-store' })).json();
    line(`ground truth: ${gt.matchCount} matches, ${gt.samples.length} samples`);
    result.expectedMatchCount = gt.matchCount;

    const memory = new WebAssembly.Memory({ initial: 16384, maximum: 16384, shared: true });
    const module = await WebAssembly.compile(await (await fetch('../replay_worker.wasm', { cache: 'no-store' })).arrayBuffer());
    const fileBlob = await (await fetch(sqliteFile)).blob();
    const file = new File([fileBlob], sqliteFile);

    const loader = new Worker('../replay-worker.js?v=' + Date.now());
    loader.postMessage({ type: 'init', role: 'loader', memory, module, threadId: 0 });
    await waitFor(loader, d => d.type === 'ready');

    let loadResult;
    try {
      const loadResultPromise = waitFor(loader, d => d.type === 'loaded');
      loader.postMessage({ type: 'load', file });
      loadResult = await loadResultPromise;
    } catch (loadErr) {
      // A genuinely empty/tick-less recording is EXPECTED to fail to load
      // (replay_worker.c's load_tick_index() rejects it on purpose) - that's
      // a pass for this edge case, not a crash/hang.
      if (gt.matchCount === 0) {
        line(`load correctly rejected empty file: ${loadErr.message}`);
        result.allPass = true;
        result.emptyFileHandledCorrectly = true;
        result.done = true;
        line('\nRESULT: PASS (empty file correctly rejected)');
        return;
      }
      throw loadErr;
    }
    line(`loaded: matchCount=${loadResult.matchCount} (ground truth says ${gt.matchCount})`);
    result.actualMatchCount = loadResult.matchCount;

    const checks = [];
    checks.push(['match count matches ground truth', loadResult.matchCount === gt.matchCount]);
    if (loadResult.matchCount === gt.matchCount) {
      for (let i = 0; i < gt.matchCount; i++) {
        const a = loadResult.matches[i], e = gt.matches[i];
        const ok = a.startTickId === e.start_tick_id && a.endTickId === e.end_tick_id;
        if (!ok) checks.push([`match #${i} boundaries match (got ${a.startTickId}..${a.endTickId}, expected ${e.start_tick_id}..${e.end_tick_id})`, false]);
      }
      if (checks.filter(c => c[0].startsWith('match #')).length === 0) checks.push(['all match boundaries match ground truth', true]);
    }

    const runningChatByMatch = {};
    let sampleFails = 0;
    const failures = [];
    const TOL = 0.01; // position float tolerance

    for (const s of gt.samples) {
      const fp = waitFor(loader, d => d.type === 'frame');
      loader.postMessage({ type: 'frame', time: s.time, seek: true });
      const f = await fp;

      const livingBuf = [];
      let corpseCount = 0;
      for (let k = 0; k < f.count; k++) {
        const x = f.buffer[k * 3 + 0], y = f.buffer[k * 3 + 1], team = f.buffer[k * 3 + 2];
        if (team === 2 || team === 3 || team === 4) corpseCount++;
        else livingBuf.push({ x, y, team });
      }
      runningChatByMatch[s.matchIdx] = (runningChatByMatch[s.matchIdx] || 0) + (f.chatMessages ? f.chatMessages.length : 0);
      const actualChatCount = runningChatByMatch[s.matchIdx];

      const problems = [];
      if (f.activeMatchIndex !== s.matchIdx) problems.push(`activeMatchIndex=${f.activeMatchIndex} expected ${s.matchIdx}`);
      if (livingBuf.length !== s.agentCount) problems.push(`agentCount=${livingBuf.length} expected ${s.agentCount}`);
      if (corpseCount !== s.corpseCount) problems.push(`corpseCount=${corpseCount} expected ${s.corpseCount}`);
      if (actualChatCount !== s.chatCount) problems.push(`chatCount(cumulative)=${actualChatCount} expected ${s.chatCount}`);
      if (livingBuf.length === s.agentCount) {
        for (let k = 0; k < livingBuf.length; k++) {
          const a = livingBuf[k], e = s.agents[k];
          if (Math.abs(a.x - e.x) > TOL || Math.abs(a.y - e.y) > TOL || a.team !== e.team) {
            problems.push(`agent[${k}] got (${a.x.toFixed(3)},${a.y.toFixed(3)},t${a.team}) expected (${e.x.toFixed(3)},${e.y.toFixed(3)},t${e.team})`);
            if (problems.length > 5) break;
          }
        }
      }

      if (problems.length) {
        sampleFails++;
        failures.push({ matchIdx: s.matchIdx, tick_id: s.tick_id, problems });
        line(`FAIL match#${s.matchIdx} tick=${s.tick_id}: ${problems.join(' | ')}`);
      }
    }
    checks.push([`all ${gt.samples.length} samples match ground truth (agents/corpses/chat/positions)`, sampleFails === 0]);
    line(`\nsample failures: ${sampleFails} / ${gt.samples.length}`);

    loader.terminate();

    let allPass = true;
    for (const [name, ok] of checks) { line((ok ? 'PASS' : 'FAIL') + ': ' + name); if (!ok) allPass = false; }
    line(allPass ? '\nRESULT: PASS' : '\nRESULT: FAIL');

    result.totalSamples = gt.samples.length;
    result.sampleFailures = sampleFails;
    result.failures = failures;
    result.checks = checks.map(([name, ok]) => ({ name, ok }));
    result.allPass = allPass;
    result.done = true;
  } catch (e) {
    line('EXCEPTION: ' + e.message + '\n' + (e.stack || ''));
    line('\nRESULT: FAIL');
    result.error = e.message;
    result.allPass = false;
    result.done = true;
  }
})();
</script>
</body></html>
